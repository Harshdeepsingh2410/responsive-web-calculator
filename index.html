<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator built with HTML, CSS and JavaScript.">
  <title>Calculator | JavaScript Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <header class="calculator-header">
        <div>
          <p class="eyebrow">JAVASCRIPT PROJECT</p>
          <h1>Calculator</h1>
        </div>
        <button id="clear" class="clear-btn" type="button" aria-label="Clear calculator">AC</button>
      </header>

      <div class="display" aria-live="polite">
        <div id="history" class="history"></div>
        <div id="display">0</div>
      </div>

      <div class="keys">
        <button type="button" class="key utility" data-action="clear">AC</button>
        <button type="button" class="key utility" data-action="backspace">⌫</button>
        <button type="button" class="key utility" data-action="percent">%</button>
        <button type="button" class="key operator" data-value="/">÷</button>

        <button type="button" class="key" data-value="7">7</button>
        <button type="button" class="key" data-value="8">8</button>
        <button type="button" class="key" data-value="9">9</button>
        <button type="button" class="key operator" data-value="*">×</button>

        <button type="button" class="key" data-value="4">4</button>
        <button type="button" class="key" data-value="5">5</button>
        <button type="button" class="key" data-value="6">6</button>
        <button type="button" class="key operator" data-value="-">−</button>

        <button type="button" class="key" data-value="1">1</button>
        <button type="button" class="key" data-value="2">2</button>
        <button type="button" class="key" data-value="3">3</button>
        <button type="button" class="key operator" data-value="+">+</button>

        <button type="button" class="key zero" data-value="0">0</button>
        <button type="button" class="key" data-action="decimal">.</button>
        <button type="button" class="key equals" data-action="equals">=</button>
      </div>

      <p class="hint">Keyboard supported: 0–9, +, −, ×, ÷, %, Enter, Backspace and Escape</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
