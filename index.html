<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header>
      <p class="eyebrow">JAVASCRIPT GAME PROJECT</p>
      <h1>Memory Match</h1>
      <p>Find all 8 matching pairs in the fewest moves and shortest time.</p>
    </header>

    <section class="stats">
      <div><span>Moves</span><strong id="moves">0</strong></div>
      <div><span>Time</span><strong id="timer">00:00</strong></div>
      <div><span>Score</span><strong id="score">1000</strong></div>
      <div><span>Best</span><strong id="best">—</strong></div>
    </section>

    <button id="newGame" class="new-game" type="button">New Game</button>
    <section id="board" class="board" aria-label="Memory game board"></section>
    <p id="status" class="status" aria-live="polite">Find all 8 pairs.</p>
  </main>

  <div id="winModal" class="modal hidden">
    <div class="modal-card">
      <div class="trophy">🏆</div>
      <p class="eyebrow">GAME COMPLETE</p>
      <h2>You matched them all!</h2>
      <p id="winText"></p>
      <button id="playAgain" class="new-game" type="button">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
